[package]
name = "quickshare"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Android Quick Share from the command line, for Flea and other front ends"
repository = "https://github.com/JaxonWright/quickshare"

[dependencies]
anyhow = "1.0"
bluer = "0.17"
clap = { version = "4.5", features = ["derive"] }
rqs_lib = { path = "vendor/rqs_lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "io-std", "io-util", "process"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
